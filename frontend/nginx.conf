server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Cabeceras basicas: sin incrustar en otros sitios, sin adivinar tipos.
  # CSP: solo scripts y estilos propios, y conexiones al propio origen y a la
  # API (http://localhost:3001 en la demo; ajustar al desplegar).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:3001; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # SPA: cualquier ruta sirve index.html.
  location / {
    try_files $uri /index.html;
  }
}
