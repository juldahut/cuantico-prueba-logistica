server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Cabeceras basicas: sin incrustar en otros sitios, sin adivinar tipos.
  # Viven en un archivo aparte para repetirlas en cada location con add_header.
  include /etc/nginx/security-headers.conf;

  # Compresion: solo texto. Las fuentes woff/woff2 ya vienen comprimidas.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

  # Los archivos de /assets/ llevan hash en el nombre: cache de un ano e
  # inmutable. Una sola cabecera Cache-Control (sin "expires", que agregaria
  # una segunda). Si un archivo no existe responde 404, no index.html.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html referencia los assets con hash: nunca debe quedar en cache.
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # SPA: cualquier ruta sirve index.html (que cae en el location de arriba).
  location / {
    try_files $uri /index.html;
  }
}
