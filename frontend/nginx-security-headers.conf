# Cabeceras de seguridad. Un solo lugar, incluido desde nginx.conf en el
# server y en cada location que declare sus propios add_header (en nginx un
# add_header dentro de un location anula los del nivel superior).
#
# CSP: solo scripts y estilos propios, y conexiones al propio origen y a la
# API (http://localhost:3001 en la demo; ajustar al desplegar). Las fuentes
# salen de /assets/ (mismo origen), cubiertas por default-src 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:3001; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
