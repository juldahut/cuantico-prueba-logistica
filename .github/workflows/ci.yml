name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    # gitleaks-action lista los commits del PR por la API: necesita leer PRs.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://cuantico_ci:cuantico_ci@localhost:5432/cuantico_ci
      # Valor de ejemplo solo para CI, nunca un secreto real.
      JWT_SECRET: ci_test_secret_not_real_but_long_enough_32
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cuantico_ci
          POSTGRES_PASSWORD: cuantico_ci
          POSTGRES_DB: cuantico_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuantico_ci -d cuantico_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx sequelize-cli db:migrate
      - run: npm test
      - run: npm audit --audit-level=high

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: '24'
      - run: npm ci
        if: hashFiles('frontend/package-lock.json') != ''
      - run: npm run lint --if-present
        if: hashFiles('frontend/package.json') != ''
      - run: npm test --if-present
        if: hashFiles('frontend/package.json') != ''
      - run: npm run build --if-present
        if: hashFiles('frontend/package.json') != ''
