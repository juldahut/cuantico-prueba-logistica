services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cuantico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-cuantico}
    ports:
      # Solo local: la base no queda expuesta en otras interfaces.
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      # Modo produccion: sin log SQL (incluiria correos y textos de busqueda).
      NODE_ENV: production
      PORT: 3001
      # Este compose es de demo: siembra comercios, eventos y usuarios de ejemplo.
      # El contenedor solo siembra con SEED_DEMO=true; ponlo en false (o quita la
      # variable en tu propio despliegue) para arrancar sin datos de demo.
      SEED_DEMO: ${SEED_DEMO:-true}
      DATABASE_URL: postgres://${POSTGRES_USER:-cuantico}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cuantico}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_IN: 2h
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_OPS_LA80_PASSWORD: ${DEMO_OPS_LA80_PASSWORD:-}
      DEMO_OPS_FARMACIA_PASSWORD: ${DEMO_OPS_FARMACIA_PASSWORD:-}
      DEMO_INGEST_PASSWORD: ${DEMO_INGEST_PASSWORD:-}
      CORS_ORIGIN: http://localhost:5173
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # Limites y timeouts (opcionales: vacio = valor por defecto del backend,
      # ver backend/.env.example).
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}
      INGEST_RPM: ${INGEST_RPM:-}
      AGENT_RPM: ${AGENT_RPM:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-}
      DB_IDLE_IN_TX_TIMEOUT_MS: ${DB_IDLE_IN_TX_TIMEOUT_MS:-}
    ports:
      # Solo local: la API no queda expuesta a otras maquinas de la red.
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001
        # El compose es de demostracion: el login muestra la pista de usuarios demo.
        VITE_DEMO_HINT: ${VITE_DEMO_HINT:-true}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  pg_data:
