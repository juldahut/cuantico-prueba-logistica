services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cuantico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-cuantico}
    ports:
      # Solo local: la base no queda expuesta en otras interfaces.
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "npx sequelize-cli db:migrate && npx sequelize-cli db:seed:all && node src/server.js"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-cuantico}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cuantico}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_IN: 2h
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Define DEMO_ADMIN_PASSWORD en .env}
      DEMO_OPS_LA80_PASSWORD: ${DEMO_OPS_LA80_PASSWORD:?Define DEMO_OPS_LA80_PASSWORD en .env}
      DEMO_OPS_FARMACIA_PASSWORD: ${DEMO_OPS_FARMACIA_PASSWORD:?Define DEMO_OPS_FARMACIA_PASSWORD en .env}
      DEMO_INGEST_PASSWORD: ${DEMO_INGEST_PASSWORD:?Define DEMO_INGEST_PASSWORD en .env}
      CORS_ORIGIN: http://localhost:5173
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  # frontend: se agrega cuando exista el proyecto React + Vite (fase de frontend).

volumes:
  pg_data:
